name: Flag is wrong or has changed
description: Report a geometry or color error, or a country's new flag. A link to a primary source is required.
title: "[XX] "
labels: [flag-change]
body:
  - type: input
    id: code
    attributes:
      label: Country code (ISO 3166-1 alpha-2)
      placeholder: KZ
    validations:
      required: true
  - type: dropdown
    id: what
    attributes:
      label: What is wrong
      options:
        - Geometry (ratio, size or position of an element)
        - Color
        - The country adopted a new flag
        - A miniature is hard to read or looks like another flag
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Which format and tier (for example, circle-16), what you see now and what it should be.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source
      description: A link to the law, decree, standard or Album des pavillons, with the page or section. Wikipedia and other flag sets do not count as sources.
    validations:
      required: true
